name: server
description: >-
  Dart Frog server for robot-notes. Authenticates a request, persists notes
  as markdown files on disk, indexes them for FTS5 search, and broadcasts
  presence/lock/changed events over a WebSocket.
publish_to: none
version: 0.2.8 # x-release-please-version

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  dart_frog: ^1.2.0
  dart_frog_web_socket: ^1.0.3
  flutter_otel_api:
    git:
      url: https://github.com/cedricziel/flutter-otel
      ref: baf04060197b1fc0abcc7b63a7ed7a38f59060c4
      path: packages/flutter_otel_api
  flutter_otel_exporter_otlp_http:
    git:
      url: https://github.com/cedricziel/flutter-otel
      ref: baf04060197b1fc0abcc7b63a7ed7a38f59060c4
      path: packages/flutter_otel_exporter_otlp_http
  flutter_otel_sdk:
    git:
      url: https://github.com/cedricziel/flutter-otel
      ref: baf04060197b1fc0abcc7b63a7ed7a38f59060c4
      path: packages/flutter_otel_sdk
  http: ^1.5.0
  logging: ^1.3.0
  meta: ^1.16.0
  mime: ^2.0.0
  pointycastle: ^4.0.0
  shared:
    path: ../shared
  shelf: ^1.4.2
  sqlite3: ^3.5.2
  ulid: ^2.0.1
  unorm_dart: ^0.3.2
  yaml: ^3.1.4
  yaml_edit: ^2.2.2

dev_dependencies:
  dart_frog_lint: ^0.1.0
  fake_async: ^1.3.3
  lints: ^6.1.0
  mocktail: ^1.0.4
  test: ^1.25.0
  web_socket_channel: ^3.0.3
