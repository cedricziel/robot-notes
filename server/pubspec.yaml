name: server
description: >-
  Dart Frog server for robot-notes. Authenticates a request, persists notes
  as markdown files on disk, indexes them for FTS5 search, and broadcasts
  presence/lock/changed events over a WebSocket.
publish_to: none
version: 0.1.1 # x-release-please-version

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  args: ^2.7.0
  dart_frog: ^1.2.0
  dart_frog_web_socket: ^1.0.3
  logging: ^1.3.0
  meta: ^1.16.0
  shared:
    path: ../shared
  sqlite3: ^3.3.1
  ulid: ^2.0.1
  yaml: ^3.1.3
  yaml_edit: ^2.2.2

dev_dependencies:
  dart_frog_lint: ^0.1.0
  fake_async: ^1.3.3
  http: ^1.5.0
  lints: ^6.1.0
  mocktail: ^1.0.4
  test: ^1.25.0
  web_socket_channel: ^3.0.3
