[project]
name = "robot-notes-hermes-plugin"
version = "0.2.18" # x-release-please-version
description = "Hermes Agent MemoryProvider plugin backed by a robot-notes workspace"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.entry-points."hermes_agent.memory_providers"]
robot_notes = "robot_notes:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["robot_notes"]

[tool.setuptools.package-data]
robot_notes = ["skills/**/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: talks to a real robot-notes server; needs ROBOT_NOTES_E2E_BASE_URL / ROBOT_NOTES_E2E_API_KEY, select with -m e2e",
]
