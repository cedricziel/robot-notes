# flutter_otel's packages are unpublished (git-only), so its own version
# constraints on its sibling packages (e.g. flutter_otel_exporter_otlp_http:
# ^0.1.0 on flutter_otel_api) can't be resolved from pub.dev. These pin the
# pure-Dart siblings (needed by both server and app) to one commit; bump
# alongside app/pubspec_overrides.yaml's flutter_otel_sdk override (same
# commit).
#
# This is a SEPARATE pubspec_overrides.yaml file rather than an inline
# `dependency_overrides:` block in pubspec.yaml deliberately: dart_frog
# build's internal dependency resolution (used to bundle the server image)
# fails to apply an inline root-level dependency_overrides block — see the
# commit that added this file for the exact failure. A pubspec_overrides.yaml
# file, which is dart_frog's own documented/recommended pattern for exactly
# this case, resolves correctly in both `dart pub get` and `dart_frog build`.
#
# flutter_otel_sdk itself is NOT overridden here, deliberately: pub pulls
# every dependency_overrides entry into the root package's own resolution
# set even when nothing in scope requires it, and flutter_otel_sdk needs
# the Flutter SDK — which server/Dockerfile's server-builder stage (a
# plain `dart:*-sdk` image, no Flutter) doesn't have. That stage strips
# `app` from the workspace but still resolves this root pubspec, so an
# override here for a Flutter-only package breaks its `dart pub get`
# even though the server itself never touches flutter_otel_sdk. Scoped
# instead to app/pubspec_overrides.yaml, which is only ever resolved with
# Flutter tooling (fastlane, the Docker web-builder stage).
#
# NOTE: server/Dockerfile's web-builder and server-builder stages must
# each COPY this file alongside pubspec.yaml — it isn't picked up
# automatically just by being a sibling on disk in the build context.
dependency_overrides:
  flutter_otel_api:
    git:
      url: https://github.com/cedricziel/flutter-otel
      ref: 5b7af474d13c9aad4bb1e5b5c6df8e445233eea6
      path: packages/flutter_otel_api
  flutter_otel_exporter_otlp_http:
    git:
      url: https://github.com/cedricziel/flutter-otel
      ref: 5b7af474d13c9aad4bb1e5b5c6df8e445233eea6
      path: packages/flutter_otel_exporter_otlp_http
