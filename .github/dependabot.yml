version: 2

# One updates: entry per ecosystem we depend on. Daily cadence catches
# CVEs as quickly as Dependabot can scan them; minor/patch updates are
# grouped per ecosystem so unrelated bumps still land as a single PR.

updates:
  # Dart server package
  - package-ecosystem: pub
    directory: /server
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]

  # Flutter app package
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      app-minor-and-patch:
        update-types: [minor, patch]

  # Shared workspace package
  - package-ecosystem: pub
    directory: /shared
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    groups:
      shared-minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions used by every workflow under .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # Container base images referenced by server/Dockerfile
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
