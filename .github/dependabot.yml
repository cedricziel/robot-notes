version: 2

# One updates: entry per ecosystem we depend on. Daily cadence catches
# CVEs as quickly as Dependabot can scan them; minor/patch updates are
# grouped per ecosystem so unrelated bumps still land as a single PR.
#
# Pub note: this repo is a Dart pub *workspace* (root pubspec.yaml has a
# `workspace:` key listing server/, app/, shared/). Dart's
# `dependency_services` — the tool Dependabot drives for pub — only runs
# at the workspace root and errors out (`Only apply dependency_services
# to the root of the workspace.`) when pointed at a member. So we have a
# single pub entry at `/`; the resolve walks every member pubspec.yaml
# and writes the shared root pubspec.lock.

updates:
  # All three workspace packages (server/, app/, shared/) resolve through
  # the root. Member-level scoping isn't possible — see the note above.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions used by every workflow under .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # Container base images referenced by server/Dockerfile
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: daily
    open-pull-requests-limit: 3
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
