version: 2

# One updates: entry per ecosystem we depend on. Weekly cadence keeps
# the PR volume sane for a small team while still catching CVEs within
# a tolerable window. Minor/patch updates are grouped per ecosystem so
# unrelated bumps don't fan out into a dozen PRs every Monday.

updates:
  # Dart server package
  - package-ecosystem: pub
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - "area:server"
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]

  # Flutter app package
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - "area:app"
    groups:
      app-minor-and-patch:
        update-types: [minor, patch]

  # Shared workspace package
  - package-ecosystem: pub
    directory: /shared
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - "area:shared"
    groups:
      shared-minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions used by every workflow under .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - "area:ci"
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # Container base images referenced by server/Dockerfile
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - "area:server"
      - "area:docker"
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
