name: publish

# Builds and pushes a multi-arch (linux/amd64, linux/arm64) container
# image of the server to ghcr.io.
#
# Two trigger modes:
#   * release: { types: [published] } — fires when release-please cuts a
#     vX.Y.Z tag + GitHub release. Produces the canonical version tag
#     set: vX.Y.Z, X.Y, X, latest, sha-<7>.
#   * push: { branches: [main] }   — produces preview tags `main` and
#     `sha-<7>` so unreleased commits can be smoke-tested.

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name is forced to lowercase to satisfy ghcr's path rules
      # for capitalised owner/repo combinations.
      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/robot-notes-server" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # Tag policy:
          #   - On a release event: vX.Y.Z, X.Y, X, latest
          #   - On a push to main:  main
          #   - Always:             sha-<7>
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=robot-notes server
            org.opencontainers.image.description=Real-time markdown notes server (HTTP + WebSocket).
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name || github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.release.published_at }}
          provenance: true
          sbom: true
