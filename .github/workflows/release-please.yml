name: release-please

# End-to-end release pipeline:
#
#   1. `release-please` job opens (and keeps in sync) a release PR that
#      bumps the version and CHANGELOG based on conventional commits since
#      the last release. Merging the PR cuts a `vX.Y.Z` tag + GitHub
#      release in the same workflow run. The release is created as a draft
#      (release-please-config.json) and published as a *pre-release* by the
#      step below.
#   2. `build` job builds the container image per architecture on a native
#      runner (no qemu) and pushes by digest. Native runners avoid the
#      qemu-emulated Dart VM crash where `dart_frog build` aborts inside
#      `__libc_calloc` / `UnixTerminal` under user-mode emulation.
#   3. `manifest` job merges the per-arch digests into a single multi-arch
#      manifest at the release tags.
#   4. `apple` matrix job (ios, macos) builds the Flutter client on a macOS
#      runner, signs it via fastlane match and uploads it to TestFlight.
#      Runs alongside the container jobs.
#   5. When a human promotes the pre-release to a full release ("Set as the
#      latest release"), GitHub emits `release: released` and the `apple`
#      job runs again in submit mode: it attaches that tag's TestFlight
#      build to the App Store version and submits it for review. Nothing
#      is rebuilt and the container jobs stay skipped.
#
# `workflow_dispatch` accepts an optional `tag` input so the publish path
# can be re-run manually against an existing tag (e.g. when the original
# release run failed mid-build and the tag is already cut).
#
# `RELEASE_PLEASE_TOKEN` is still required: a PR opened by `GITHUB_TOKEN`
# does not trigger downstream workflow runs, so without the PAT the
# release PR opens but `ci.yml` never reports back on it, making the
# release merge ungated. The fallback to `GITHUB_TOKEN` keeps the
# workflow operational during initial bootstrap.

on:
  push:
    branches: [main]
  # Fires when a pre-release is promoted to a full release (and when a
  # non-pre-release is published). Pre-release creation fires `published`
  # and `prereleased` only, so the App Store submit never races the
  # TestFlight upload of the same tag.
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag (e.g. v0.1.0) to (re)publish. Leave blank
          to run release-please normally.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'release' && inputs.tag == '' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please creates the release as a draft (no tag, no events).
      # Publishing it here as a pre-release with GITHUB_TOKEN creates the
      # tag but emits no workflow-triggering event, so the only way to
      # reach the App Store submit path is a human promoting the
      # pre-release to a full release.
      - name: Publish draft as pre-release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.release.outputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false --prerelease

  # Resolve the tag once so every downstream job agrees on what we are
  # doing — the freshly-cut tag from release-please, the manually-supplied
  # `tag` input, or the promoted release — and in which mode:
  #   publish: build + push the image, build + upload to TestFlight
  #   submit:  App Store review for an existing TestFlight build
  resolve-tag:
    name: Resolve release tag
    needs: [release-please]
    if: |
      always() &&
      (
        github.event_name == 'release' ||
        inputs.tag != '' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.pick.outputs.tag_name }}
      major: ${{ steps.pick.outputs.major }}
      minor: ${{ steps.pick.outputs.minor }}
      version: ${{ steps.pick.outputs.version }}
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          RP_MAJOR: ${{ needs.release-please.outputs.major }}
          RP_MINOR: ${{ needs.release-please.outputs.minor }}
          RP_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          mode=publish
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
            mode=submit
          elif [ -n "$DISPATCH_TAG" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="$RP_TAG"
          fi
          if [ "$EVENT_NAME" = "release" ] || [ -n "$DISPATCH_TAG" ]; then
            version="${tag#v}"
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
          else
            version="$RP_VERSION"
            major="$RP_MAJOR"
            minor="$RP_MINOR"
          fi
          {
            echo "tag_name=$tag"
            echo "version=$version"
            echo "major=$major"
            echo "minor=$minor"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

  # Pre-build the Flutter web bundle once. Output is JS/HTML/WASM and
  # therefore architecture-independent, so doing it on a single amd64
  # runner and shipping the artifact down to both arch builds halves the
  # total Flutter compile time across the matrix. The Dockerfile's
  # `web-bundle` stage is overridden in the arch builds via
  # `--build-context`, which is why we export the bundle root-flat here.
  web:
    name: Build web bundle
    needs: [resolve-tag]
    # resolve-tag uses `if: always()` so it can run when release-please was
    # skipped (workflow_dispatch with a tag input). Without `always()` here
    # GitHub Actions propagates "skipped" through the transitive chain
    # (release-please → resolve-tag → web) regardless of an explicit `if:`
    # — a status-check function must appear in the condition for GitHub to
    # evaluate it instead of inheriting the skip. See:
    # https://docs.github.com/en/actions/using-jobs/using-conditions-to-control-job-execution
    if: always() && needs.resolve-tag.result == 'success' && needs.resolve-tag.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web bundle (Dockerfile target=web-bundle)
        run: |
          docker buildx build \
            --target web-bundle \
            --output type=local,dest=./prebuilt-web \
            --file server/Dockerfile \
            .

      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: ./prebuilt-web
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.platform }}
    needs: [resolve-tag, web]
    if: always() && needs.resolve-tag.result == 'success' && needs.resolve-tag.outputs.mode == 'publish'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_slug: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: ./prebuilt-web

      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/robot-notes-server" >> "$GITHUB_OUTPUT"

      # Push by digest only — the `manifest` job below stitches per-arch
      # digests into the user-facing tags. Setting `tags: ""` and
      # `outputs: type=image,push-by-digest=true,name-canonical=true` is
      # the pattern from
      # https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
      #
      # `build-contexts: web-bundle=./prebuilt-web` overrides the
      # Dockerfile's `web-bundle` stage with the prebuilt artifact, so
      # the per-arch image build skips Flutter entirely.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-contexts: |
            web-bundle=./prebuilt-web
          labels: |
            org.opencontainers.image.title=robot-notes server
            org.opencontainers.image.description=Real-time markdown notes server (HTTP + WebSocket).
            org.opencontainers.image.licenses=MIT
          build-args: |
            VERSION=${{ needs.resolve-tag.outputs.tag_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Merge manifests
    needs: [resolve-tag, build]
    if: always() && needs.resolve-tag.result == 'success' && needs.resolve-tag.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/robot-notes-server" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # Release-only tag set: vX.Y.Z, X.Y, X, latest, plus a sha-<7>
          # alias for callers who want a content-addressable handle.
          tags: |
            type=raw,value=${{ needs.resolve-tag.outputs.tag_name }}
            type=raw,value=${{ needs.resolve-tag.outputs.major }}.${{ needs.resolve-tag.outputs.minor }}
            type=raw,value=${{ needs.resolve-tag.outputs.major }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tag_args \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ steps.image.outputs.name }}:${{ needs.resolve-tag.outputs.tag_name }}

  # Ship the Flutter client from the same tag. One job per platform so an
  # Apple-side failure on one never blocks the other, and neither blocks the
  # container publish above. Signing comes from `fastlane match` (read-only)
  # over a deploy key.
  #
  # Two modes, picked by resolve-tag:
  #   - publish (every pre-release, or a `tag` dispatch): build, sign,
  #     upload to TestFlight, wait for processing. Internal testers get the
  #     build right away.
  #   - submit (`release: released`, i.e. the pre-release was promoted): no
  #     build; attach that tag's TestFlight build to the App Store version,
  #     upload the listing metadata, submit for review with automatic
  #     release.
  # See RELEASING.md, "Apple App Store".
  apple:
    name: ${{ needs.resolve-tag.outputs.mode == 'submit' && 'App Store submit' || 'TestFlight' }} (${{ matrix.platform }})
    needs: [resolve-tag]
    if: always() && needs.resolve-tag.result == 'success' && needs.resolve-tag.outputs.tag_name != ''
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            lane_platform: ios
            artifact_glob: app/build/fastlane/*.ipa
          - platform: macos
            lane_platform: mac
            artifact_glob: app/build/fastlane/*.pkg
    env:
      SUBMIT: ${{ needs.resolve-tag.outputs.mode == 'submit' }}
    steps:
      # fetch-depth: 0 so `git rev-list --count HEAD` yields the real build
      # number instead of 1. The submit path needs it too: that is how the
      # lane finds the TestFlight build to attach.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.tag_name }}
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app

      # bundler-cache installs gems under app/vendor/bundle, whose executables
      # are not on the PATH even inside `bundle exec`. Flutter shells out to
      # `pod`, so without this it finds the runner's preinstalled CocoaPods,
      # which is broken once setup-ruby has switched Ruby.
      - name: Put the bundled CocoaPods on the PATH
        if: env.SUBMIT != 'true'
        working-directory: app
        run: |
          bundle binstubs cocoapods --path bin
          echo "$PWD/bin" >> "$GITHUB_PATH"
          bin/pod --version

      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/release_notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$file" || : > "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        if: env.SUBMIT != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        if: env.SUBMIT != 'true'
        run: dart pub get

      - name: Configure SSH for match repo
        if: env.SUBMIT != 'true'
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Build and upload to TestFlight
        if: env.SUBMIT != 'true'
        working-directory: app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.file }}
          FASTLANE_HIDE_CHANGELOG: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: |
          bundle exec fastlane ${{ matrix.lane_platform }} release \
            version:"${{ needs.resolve-tag.outputs.version }}"

      - name: Submit the TestFlight build to App Store review
        if: env.SUBMIT == 'true'
        working-directory: app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.file }}
          FASTLANE_HIDE_CHANGELOG: "true"
        run: |
          bundle exec fastlane ${{ matrix.lane_platform }} submit_to_app_store \
            version:"${{ needs.resolve-tag.outputs.version }}"

      - name: Upload build artifact
        if: always() && env.SUBMIT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: robot-notes-${{ matrix.platform }}-${{ needs.resolve-tag.outputs.tag_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: ignore
          retention-days: 30
