name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly hermes-plugin drift check against hermes-agent's default branch (NOT the
    # pin in hermes-plugin/HERMES_AGENT_SHA) — see the hermes-plugin-contract job.
    # continue-on-error there turns a break into a yellow run instead of a red one:
    # this is a heads-up to bump the pin, never a merge gate.
    - cron: "17 6 * * 1" # Monday 06:17 UTC

# Cancel any in-flight run for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart:
    name: Lint, format, test (Dart + Flutter workspace)
    runs-on: ubuntu-latest
    # The weekly `schedule` trigger exists only to drive hermes-plugin-contract's
    # upstream-drift check below; it has nothing to do with the Dart/Flutter
    # workspace, so skip it here (docker `needs: dart` skips along with it).
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      # Pinned to match developer machines (3.47.x ships Dart 3.13). The
      # workspace pubspecs declare sdk: ^3.6, so any Flutter 3.27+ would
      # technically resolve, but pinning to the version we actually use
      # locally avoids "works on my machine" surprises.
      - name: Setup Flutter (provides Dart SDK)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze (strict-mode)
        run: dart analyze

      - name: Test — shared
        run: cd shared && dart test --reporter expanded

      - name: Test — server
        run: cd server && dart test --reporter expanded

      - name: Test — app (Flutter)
        run: cd app && flutter test --reporter expanded

  hermes-plugin-changes:
    name: Detect hermes-plugin/ changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            changed:
              - 'hermes-plugin/**'

  hermes-plugin:
    name: Test hermes-plugin (Python)
    runs-on: ubuntu-latest
    needs: hermes-plugin-changes
    if: needs.hermes-plugin-changes.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: hermes-plugin
        run: pip install -e '.[dev]'

      - name: Test
        working-directory: hermes-plugin
        run: python -m pytest

  # Runs the hermes-plugin suite a second time with a real hermes-agent checkout on
  # PYTHONPATH, so tests/test_stub_parity.py and tests/test_memory_manager_contract.py
  # exercise the actual upstream MemoryProvider ABC / MemoryManager instead of being
  # skipped (the `hermes-plugin` job above never has hermes-agent on the path). On a
  # PR/push this checks out the pin in hermes-plugin/HERMES_AGENT_SHA; the weekly
  # `schedule` run instead checks out hermes-agent's own default branch and is
  # continue-on-error, so upstream drift shows up as a yellow run rather than blocking
  # PRs — see hermes-plugin/HERMES_AGENT_SHA for how to bump the pin when that happens.
  # No `pip install` of hermes-agent's own dependencies is needed for either test (see
  # their docstrings): a bare PYTHONPATH checkout is enough.
  hermes-plugin-contract:
    name: Test hermes-plugin against the hermes-agent contract
    runs-on: ubuntu-latest
    needs: hermes-plugin-changes
    if: github.event_name == 'schedule' || needs.hermes-plugin-changes.outputs.changed == 'true'
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve hermes-agent ref
        id: hermes_agent_ref
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            sha=$(grep -vE '^[[:space:]]*(#|$)' hermes-plugin/HERMES_AGENT_SHA | tr -d '[:space:]')
            if [ -z "$sha" ]; then
              echo "::error::hermes-plugin/HERMES_AGENT_SHA has no pinned commit" >&2
              exit 1
            fi
            echo "ref=$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout hermes-agent (${{ steps.hermes_agent_ref.outputs.ref }})
        run: |
          git init --quiet /tmp/hermes-agent
          git -C /tmp/hermes-agent remote add origin https://github.com/NousResearch/hermes-agent
          git -C /tmp/hermes-agent fetch --quiet --depth 1 origin "${{ steps.hermes_agent_ref.outputs.ref }}"
          git -C /tmp/hermes-agent checkout --quiet FETCH_HEAD

      - name: Install dependencies
        working-directory: hermes-plugin
        run: pip install -e '.[dev]'

      - name: Test (parity + MemoryManager contract not skipped)
        working-directory: hermes-plugin
        env:
          PYTHONPATH: /tmp/hermes-agent
        run: python -m pytest -v

  e2e-changes:
    name: Detect e2e-relevant changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            changed:
              - '.github/workflows/ci.yml'
              - 'hermes-plugin/**'
              - 'claude-plugin/hooks/**'
              - 'server/**'
              - 'shared/**'

  e2e:
    name: End-to-end (hermes-plugin + Claude hook vs a live server)
    runs-on: ubuntu-latest
    needs: e2e-changes
    if: needs.e2e-changes.outputs.changed == 'true'
    env:
      ROBOT_NOTES_API_KEY: e2e-test-key-not-a-secret
      ROBOT_NOTES_DATA_DIR: ${{ github.workspace }}/.e2e-data
      ROBOT_NOTES_PORT: "8098"
    steps:
      - uses: actions/checkout@v7

      # Same toolchain as the `dart` job: the server is a Dart Frog app and
      # building it (`dart_frog build` below, what `make run-server` and the
      # server-builder Dockerfile stage use) needs the SDK on PATH.
      - name: Setup Flutter (provides Dart SDK)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: dart pub get

      # dart_frog_cli isn't a workspace dependency (it's a global dev tool,
      # same as the Dockerfile's server-builder stage activates it) — pin the
      # same major version for a reproducible renderer.
      - name: Install dart_frog_cli
        run: |
          dart pub global activate dart_frog_cli ^1.2.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # Build the server the way production does (see server/Dockerfile):
      # `dart_frog build` renders the production tree, then `dart build cli`
      # runs Dart's build hooks so package:sqlite3 (3.x) bundles a native
      # libsqlite3.so next to the binary. Starting the server with
      # `dart_frog dev` instead (used here previously) skips build hooks
      # entirely — package:sqlite3 then has no bundled library and no
      # in-process fallback on this runner ("Couldn't resolve native
      # function 'sqlite3_initialize' ... No available native assets").
      - name: Build robot-notes server (production build)
        working-directory: server
        run: |
          dart_frog build
          # The generated entrypoint (build/bin/server.dart) hardcodes
          # `InternetAddress.anyIPv6`. GitHub-hosted Actions runners do not
          # support IPv6 at all, so binding `::` fails outright ("Address
          # family not supported by protocol"). The old
          # `dart_frog dev --hostname 127.0.0.1` flag doesn't apply here --
          # `--hostname` is a dev-server-only option that never reaches
          # this generated file -- so patch the one line by hand to force
          # IPv4 loopback instead, keeping the server bound to 127.0.0.1
          # as before.
          sed -i 's/InternetAddress\.anyIPv6/InternetAddress.loopbackIPv4/' build/bin/server.dart
          cd build
          dart pub get
          dart build cli -o out

      - name: Start robot-notes server
        run: |
          mkdir -p "$ROBOT_NOTES_DATA_DIR"
          # No --embedding-provider: semantic search (Ollama) stays disabled,
          # matching the default `make run-server` behavior — this job only
          # needs keyword search + the REST CRUD surface.
          #
          # setsid puts the server in its own process group, so "Stop
          # robot-notes server" below can kill the whole group.
          setsid server/build/out/bundle/bin/server \
            > "$RUNNER_TEMP/robot-notes-server.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/robot-notes-server.pid"

      - name: Wait for the server to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${ROBOT_NOTES_PORT}/healthz" >/dev/null 2>&1; then
              echo "robot-notes server is up"
              exit 0
            fi
            sleep 1
          done
          echo "robot-notes server did not become healthy in time" >&2
          cat "$RUNNER_TEMP/robot-notes-server.log" || true
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install hermes-plugin dependencies
        working-directory: hermes-plugin
        run: pip install -e '.[dev]'

      - name: Run e2e tests
        working-directory: hermes-plugin
        env:
          ROBOT_NOTES_E2E_BASE_URL: http://127.0.0.1:8098
          ROBOT_NOTES_E2E_API_KEY: ${{ env.ROBOT_NOTES_API_KEY }}
        run: python -m pytest -m e2e -v

      - name: Show server log
        if: always()
        run: cat "$RUNNER_TEMP/robot-notes-server.log" || true

      - name: Stop robot-notes server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/robot-notes-server.pid" ]; then
            PID="$(cat "$RUNNER_TEMP/robot-notes-server.pid")"
            kill -- "-$PID" 2>/dev/null || kill "$PID" 2>/dev/null || true
          fi

  docker:
    name: Validate server Dockerfile
    runs-on: ubuntu-latest
    needs: dart
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only pushes to `main` publish; PR builds stay push:false below.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        if: github.event_name == 'push'
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/robot-notes-server" >> "$GITHUB_OUTPUT"

      # The Dockerfile lives at server/Dockerfile but the build context is
      # the repo root because the server depends on the shared/ workspace
      # package via path dependency. On pull requests this only validates
      # the build (push: false); on push to `main` it also publishes a
      # rolling `:main` tag (amd64 only — the release pipeline in
      # release-please.yml covers multi-arch release tags).
      - name: Build server image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}:main', steps.image.outputs.name) || '' }}
          build-args: |
            VERSION=${{ github.event_name == 'push' && 'main' || format('ci-{0}', github.sha) }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
