name: app
description: >-
  Flutter multi-platform client for robot-notes. Lists, reads, edits, locks,
  and searches notes against the server API; streams presence/lock/changed
  events over a WebSocket. Builds for Android, iOS, macOS, Windows, Linux,
  and Web from a single codebase.
publish_to: none
version: 0.2.6 # x-release-please-version

environment:
  sdk: ^3.8.0
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  device_info_plus: ^13.2.0
  flutter_markdown_plus: ^1.0.12
  flutter_otel:
    git:
      url: https://github.com/cedricziel/flutter-otel
      ref: 3ff0c411a2df6f844b943015efb9fb78d4e5f836
      path: packages/flutter_otel
  flutter_otel_api:
    git:
      url: https://github.com/cedricziel/flutter-otel
      ref: 3ff0c411a2df6f844b943015efb9fb78d4e5f836
      path: packages/flutter_otel_api
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.1
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.1
  http: ^1.5.0
  logging: ^1.3.0
  meta: ^1.16.0
  shared:
    path: ../shared
  url_launcher: ^6.3.1
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/branding/icon_1024.png"
  android: true
  adaptive_icon_background: "#3F51B5"
  adaptive_icon_foreground: "assets/branding/adaptive_foreground_1024.png"
  ios: true
  macos:
    generate: true
    image_path: "assets/branding/icon_1024.png"
  windows:
    generate: true
    image_path: "assets/branding/icon_1024.png"
  linux:
    generate: true
    image_path: "assets/branding/icon_1024.png"
  web:
    generate: true
    image_path: "assets/branding/icon_1024.png"
    background_color: "#3F51B5"
    theme_color: "#3F51B5"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/branding/splash_light_512.png"
  color_dark: "#1A237E"
  image_dark: "assets/branding/splash_dark_512.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/branding/splash_light_512.png"
    icon_background_color: "#FFFFFF"
    color_dark: "#1A237E"
    image_dark: "assets/branding/splash_dark_512.png"
    icon_background_color_dark: "#1A237E"
  web: true
  android: true
  ios: true
