name: app
description: >-
  Flutter multi-platform client for robot-notes. Lists, reads, edits, locks,
  and searches notes against the server API; streams presence/lock/changed
  events over a WebSocket. Builds for Android, iOS, macOS, Windows, Linux,
  and Web from a single codebase.
publish_to: none
version: 0.1.1 # x-release-please-version

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  http: ^1.5.0
  logging: ^1.3.0
  shared:
    path: ../shared
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
