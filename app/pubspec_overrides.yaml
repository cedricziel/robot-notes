# dart_otel_sdk is unpublished, so flutter_otel's own version constraint
# on it (^0.1.0) needs an override — scoped here rather than the workspace
# root because dart_otel_sdk requires the Flutter SDK, and app is the
# only workspace member ever resolved with Flutter tooling. See
# pubspec_overrides.yaml (workspace root) for why a root-level override
# would break server/Dockerfile's plain-Dart server-builder stage, and why
# this is a separate file rather than an inline `dependency_overrides:`
# block. Bump alongside the root's dart_otel_api/
# dart_otel_exporter_otlp_http overrides (same commit).
dependency_overrides:
  dart_otel_sdk:
    git:
      url: https://github.com/cedricziel/flutter-otel
      ref: e31c5db91705f8d3264f66d28f58b5d03a9e25d7
      path: packages/dart_otel_sdk
