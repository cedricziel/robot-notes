name: robot_notes_root
description: >-
  Workspace root for robot-notes (server + app + shared API-contract package).
  Hosts the dart_pre_commit dev dependency and the git-hook installer.
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - shared
  - server
  - app

dev_dependencies:
  dart_pre_commit: ^6.1.2

dart_pre_commit:
  format: null
  analyze: null
  outdated:
    # sqlite3 3.0.0 swapped DynamicLibrary loading for build hooks. Our
    # runtime image dlopens libsqlite3 from apt, so we deliberately stay
    # on the 2.x line — see server/pubspec.yaml.
    allowed: [sqlite3]
