schema: spec-driven

context: |
  Robot Notes provides real-time knowledge management for humans and AI agents.
  This repository is a Dart pub workspace with three packages:
  - server/: Dart Frog HTTP and WebSocket server with Markdown file storage and SQLite FTS5 search.
  - app/: Flutter client for mobile, desktop, and web.
  - shared/: Pure Dart API contracts shared by the server and client.
  Use conventional commits and keep changes small and coherent.

rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 15 minutes
    - Always include a "Definition of Done" section
    - Always follow TDD principles, failing tests first
    - Atomic commits with conventional commit messages
